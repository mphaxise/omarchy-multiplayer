<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <style>
    text { font-family: 'DejaVu Sans Mono','Menlo','Consolas','Liberation Mono',monospace; }
    .fg { fill:#e6e6e6; }
    .muted { fill:#8a8a8a; }
    .dim { fill:#5a5a5a; }
    .accent { fill:#5b9dd9; }
    .urgent { fill:#c2352f; }
    .line { stroke:#4a4a4a; stroke-width:1.2; fill:none; }
    .line-soft { stroke:#303030; stroke-width:1; fill:none; }
    .accent-line { stroke:#5b9dd9; stroke-width:1.6; fill:none; }
    .dash { stroke-dasharray:6,4; }
  </style>

  <rect x="0" y="0" width="1280" height="800" fill="#111111"/>

  <!-- ============ TOP BAR ============ -->
  <rect x="0" y="0" width="1280" height="32" fill="#1b1b1c"/>
  <line x1="0" y1="32" x2="1280" y2="32" class="line"/>

  <rect x="14" y="7" width="22" height="18" rx="3" fill="#1c2733" class="accent-line"/>
  <text x="25" y="20" text-anchor="middle" font-size="11" font-weight="700" class="accent">1</text>
  <rect x="40" y="7" width="22" height="18" rx="3" class="line"/>
  <text x="51" y="20" text-anchor="middle" font-size="11" class="muted">2</text>
  <rect x="66" y="7" width="22" height="18" rx="3" class="line"/>
  <text x="77" y="20" text-anchor="middle" font-size="11" class="muted">3</text>
  <rect x="92" y="7" width="22" height="18" rx="3" class="line"/>
  <text x="103" y="20" text-anchor="middle" font-size="11" class="muted">4</text>
  <rect x="118" y="7" width="22" height="18" rx="3" class="line"/>
  <text x="129" y="20" text-anchor="middle" font-size="11" class="muted">5</text>

  <text x="640" y="20" text-anchor="middle" font-size="12" class="fg">12:51</text>

  <rect x="1100" y="10" width="2" height="5" fill="#8a8a8a"/>
  <rect x="1104" y="7" width="2" height="8" fill="#8a8a8a"/>
  <rect x="1108" y="4" width="2" height="11" fill="#8a8a8a"/>
  <circle cx="1136" cy="16" r="6" class="line"/>
  <rect x="1158" y="10" width="12" height="12" rx="2" class="line"/>

  <!-- sessions widget: glyph + badge = 1 (api-refactor blocked), urgent color -->
  <rect x="1214" y="7" width="18" height="18" rx="3" fill="none" stroke="#9a9a9a" stroke-width="1.3"/>
  <line x1="1218" y1="13" x2="1229" y2="13" stroke="#9a9a9a" stroke-width="1.2"/>
  <line x1="1218" y1="17" x2="1225" y2="17" stroke="#9a9a9a" stroke-width="1.2"/>
  <circle cx="1232" cy="8" r="7" fill="#c2352f" stroke="#1b1b1c" stroke-width="2"/>
  <text x="1232" y="11.5" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">1</text>

  <!-- caret linking widget to open panel -->
  <polygon points="1216,32 1230,32 1223,40" fill="#161616" stroke="#4a4a4a" stroke-width="1"/>

  <!-- ============ TITLE ============ -->
  <rect x="16" y="58" width="90" height="20" rx="10" fill="none" class="accent-line"/>
  <text x="61" y="72" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1" class="accent">PROPOSED</text>
  <text x="118" y="73" font-size="15" font-weight="600" class="fg">Sessions panel -- open, three sessions</text>
  <text x="16" y="94" font-size="11" class="muted">Needs you / Working / Done today, in that order. First row expanded.</text>

  <!-- ============ PANEL ============ -->
  <rect x="700" y="40" width="540" height="540" rx="6" fill="#161616" stroke="#4a4a4a" stroke-width="1.2"/>

  <!-- hero -->
  <text x="720" y="80" font-size="18" font-weight="700" class="fg">api-refactor needs you</text>
  <text x="720" y="100" font-size="12" class="muted">blocked - 4m     1 needs you  |  1 working  |  1 done today</text>
  <line x1="712" y1="112" x2="1228" y2="112" class="line-soft"/>

  <!-- section: needs you -->
  <text x="720" y="130" font-size="11" font-weight="700" letter-spacing="1" class="muted">NEEDS YOU</text>

  <!-- row 1: api-refactor, expanded + focused -->
  <rect x="712" y="140" width="516" height="140" rx="4" fill="#1c1f22" stroke="#5b9dd9" stroke-width="1.6"/>

  <rect x="730" y="152" width="14" height="14" rx="2" class="line"/>
  <text x="737" y="162.5" text-anchor="middle" font-size="9" font-weight="700" class="muted">C</text>
  <text x="752" y="163" font-size="13" font-weight="600" class="fg">api-refactor</text>
  <text x="852" y="163" font-size="12" font-weight="600" class="urgent">blocked - 4m</text>
  <circle cx="936" cy="158" r="4" fill="none" stroke="#e6e6e6" stroke-width="1.2"/>
  <text x="946" y="162" font-size="9" font-style="italic" class="dim">(inferred status)</text>

  <text x="752" y="182" font-size="11" class="muted">branch: session/api-refactor    owner: praneet</text>

  <!-- actions -->
  <rect x="730" y="196" width="118" height="26" rx="4" fill="none" stroke="#5b9dd9" stroke-width="1.4"/>
  <text x="789" y="213" text-anchor="middle" font-size="11" font-weight="600" class="fg">Open (Enter)</text>
  <rect x="858" y="196" width="100" height="26" rx="4" class="line"/>
  <text x="908" y="213" text-anchor="middle" font-size="11" class="muted">Send (s)</text>
  <rect x="968" y="196" width="100" height="26" rx="4" class="line"/>
  <text x="1018" y="213" text-anchor="middle" font-size="11" class="muted">Stop (x)</text>
  <rect x="1078" y="196" width="118" height="26" rx="4" class="line"/>
  <text x="1137" y="213" text-anchor="middle" font-size="11" class="muted">Receipt (r)</text>

  <!-- inline send field (opened by "s") -->
  <rect x="730" y="230" width="466" height="26" rx="4" fill="#101010" stroke="#4a4a4a" stroke-width="1.2"/>
  <text x="740" y="247" font-size="11" font-style="italic" class="dim">type a message, Enter to send, Esc to cancel</text>

  <!-- section: working -->
  <line x1="712" y1="294" x2="1228" y2="294" class="line-soft"/>
  <text x="720" y="312" font-size="11" font-weight="700" letter-spacing="1" class="muted">WORKING</text>

  <!-- row 2: docs-site, collapsed -->
  <rect x="730" y="322" width="14" height="14" rx="2" class="line"/>
  <text x="737" y="332.5" text-anchor="middle" font-size="9" font-weight="700" class="muted">O</text>
  <text x="752" y="333" font-size="13" font-weight="600" class="fg">docs-site</text>
  <text x="852" y="333" font-size="12" class="fg">working - 12m</text>
  <text x="752" y="352" font-size="11" class="muted">branch: session/docs-site</text>

  <!-- section: done today -->
  <line x1="712" y1="368" x2="1228" y2="368" class="line-soft"/>
  <text x="720" y="386" font-size="11" font-weight="700" letter-spacing="1" class="muted">DONE TODAY</text>

  <!-- row 3: crash-1516893, collapsed -->
  <rect x="730" y="396" width="14" height="14" rx="2" class="line"/>
  <text x="737" y="406.5" text-anchor="middle" font-size="9" font-weight="700" class="muted">C</text>
  <text x="752" y="407" font-size="13" font-weight="600" class="fg">crash-1516893</text>
  <text x="890" y="407" font-size="12" class="dim">done - 2h</text>
  <text x="752" y="426" font-size="11" class="dim">branch: none</text>

  <!-- keyboard legend -->
  <line x1="712" y1="442" x2="1228" y2="442" class="line-soft"/>
  <text x="720" y="460" font-size="10" font-weight="700" letter-spacing="1" class="dim">KEYBOARD</text>

  <rect x="720" y="472" width="44" height="20" rx="3" class="line"/>
  <text x="742" y="486" text-anchor="middle" font-size="8" class="muted">up/dn</text>
  <text x="770" y="486" font-size="10" class="muted">move selection</text>

  <rect x="886" y="472" width="44" height="20" rx="3" class="accent-line"/>
  <text x="908" y="486" text-anchor="middle" font-size="8" class="fg">Enter</text>
  <text x="936" y="486" font-size="10" class="muted">open</text>

  <rect x="1040" y="472" width="30" height="20" rx="3" class="line"/>
  <text x="1055" y="486" text-anchor="middle" font-size="9" class="fg">s</text>
  <text x="1076" y="486" font-size="10" class="muted">send</text>

  <rect x="720" y="502" width="30" height="20" rx="3" class="line"/>
  <text x="735" y="516" text-anchor="middle" font-size="9" class="fg">x</text>
  <text x="756" y="516" font-size="10" class="muted">stop (press twice)</text>

  <rect x="930" y="502" width="30" height="20" rx="3" class="line"/>
  <text x="945" y="516" text-anchor="middle" font-size="9" class="fg">r</text>
  <text x="966" y="516" font-size="10" class="muted">receipt</text>

  <rect x="1090" y="502" width="40" height="20" rx="3" class="line"/>
  <text x="1110" y="516" text-anchor="middle" font-size="8" class="fg">Esc</text>
  <text x="1136" y="516" font-size="10" class="muted">close</text>

  <!-- ============ WIREFRAME KEY (meta legend, all screens) ============ -->
  <rect x="24" y="706" width="300" height="72" rx="4" fill="#161616" stroke="#4a4a4a" stroke-width="1"/>
  <text x="34" y="722" font-size="10" font-weight="700" letter-spacing="1" class="dim">WIREFRAME KEY</text>
  <line x1="34" y1="732" x2="54" y2="732" class="line"/>
  <text x="60" y="736" font-size="9" class="dim">solid = real UI element</text>
  <line x1="34" y1="748" x2="54" y2="748" class="line dash"/>
  <text x="60" y="752" font-size="9" class="dim">dashed = annotation / callout</text>
  <rect x="34" y="760" width="12" height="8" fill="#c2352f"/>
  <text x="60" y="768" font-size="9" class="dim">red = urgent color</text>

  <!-- ============ FOOTER ============ -->
  <text x="24" y="792" font-size="10" class="dim">proposed, 2026-09-01, drawn against the spec, not the rig</text>
  <text x="1256" y="792" text-anchor="end" font-size="10" class="dim">sessions-panel / panel-three-sessions / v4.0.2</text>
</svg>
