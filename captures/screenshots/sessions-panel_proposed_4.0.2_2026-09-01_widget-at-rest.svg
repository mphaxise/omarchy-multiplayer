<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <style>
    text { font-family: 'DejaVu Sans Mono','Menlo','Consolas','Liberation Mono',monospace; }
    .fg { fill:#e6e6e6; }
    .muted { fill:#8a8a8a; }
    .dim { fill:#5a5a5a; }
    .accent { fill:#5b9dd9; }
    .line { stroke:#4a4a4a; stroke-width:1.2; fill:none; }
    .line-soft { stroke:#303030; stroke-width:1; fill:none; }
    .accent-line { stroke:#5b9dd9; stroke-width:1.4; fill:none; }
    .dash { stroke-dasharray:6,4; }
  </style>

  <!-- background -->
  <rect x="0" y="0" width="1280" height="800" fill="#111111"/>

  <!-- ============ TOP BAR ============ -->
  <rect x="0" y="0" width="1280" height="32" fill="#1b1b1c"/>
  <line x1="0" y1="32" x2="1280" y2="32" class="line"/>

  <!-- workspaces (left) -->
  <rect x="14" y="7" width="22" height="18" rx="3" fill="#1c2733" class="accent-line"/>
  <text x="25" y="20" text-anchor="middle" font-size="11" font-weight="700" class="accent">1</text>
  <rect x="40" y="7" width="22" height="18" rx="3" class="line"/>
  <text x="51" y="20" text-anchor="middle" font-size="11" class="muted">2</text>
  <rect x="66" y="7" width="22" height="18" rx="3" class="line"/>
  <text x="77" y="20" text-anchor="middle" font-size="11" class="muted">3</text>
  <rect x="92" y="7" width="22" height="18" rx="3" class="line"/>
  <text x="103" y="20" text-anchor="middle" font-size="11" class="muted">4</text>
  <rect x="118" y="7" width="22" height="18" rx="3" class="line"/>
  <text x="129" y="20" text-anchor="middle" font-size="11" class="muted">5</text>

  <!-- clock (center) -->
  <text x="640" y="20" text-anchor="middle" font-size="12" class="fg">12:47</text>

  <!-- generic right-side widgets (undecorated context) -->
  <rect x="1100" y="10" width="2" height="5" class="muted" fill="#8a8a8a"/>
  <rect x="1104" y="7" width="2" height="8" fill="#8a8a8a"/>
  <rect x="1108" y="4" width="2" height="11" fill="#8a8a8a"/>
  <circle cx="1136" cy="16" r="6" class="line"/>
  <rect x="1158" y="10" width="12" height="12" rx="2" class="line"/>

  <!-- sessions widget: glyph + badge (the subject of this screen) -->
  <rect x="1214" y="7" width="18" height="18" rx="3" fill="none" stroke="#9a9a9a" stroke-width="1.3"/>
  <line x1="1218" y1="13" x2="1229" y2="13" stroke="#9a9a9a" stroke-width="1.2"/>
  <line x1="1218" y1="17" x2="1225" y2="17" stroke="#9a9a9a" stroke-width="1.2"/>
  <circle cx="1232" cy="8" r="7" fill="#c2352f" stroke="#1b1b1c" stroke-width="2"/>
  <text x="1232" y="11.5" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">2</text>

  <!-- small captions under bar regions -->
  <text x="14" y="46" font-size="9" class="dim">workspaces</text>
  <text x="640" y="46" text-anchor="middle" font-size="9" class="dim">clock</text>
  <text x="1100" y="46" font-size="9" class="dim">widgets (right)</text>

  <!-- ============ TITLE ============ -->
  <rect x="16" y="58" width="90" height="20" rx="10" fill="none" class="accent-line"/>
  <text x="61" y="72" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1" class="accent">PROPOSED</text>
  <text x="118" y="73" font-size="15" font-weight="600" class="fg">Sessions panel -- widget at rest</text>
  <text x="16" y="94" font-size="11" class="muted">Bar glyph and badge only; panel closed. Callout explains the glyph, badge, and color rule below.</text>

  <!-- leader line from widget down to callout -->
  <line x1="1223" y1="25" x2="1223" y2="132" class="line dash"/>

  <!-- ============ CALLOUT: glyph / badge / color rules ============ -->
  <rect x="760" y="132" width="480" height="270" rx="6" fill="#161616" stroke="#4a4a4a" stroke-width="1.2" stroke-dasharray="6,4"/>

  <text x="780" y="160" font-size="14" font-weight="600" class="fg">Glyph, badge, and color -- from spec-03</text>

  <text x="780" y="182" font-size="12" class="muted">Glyph: one icon for the whole plugin (same shape always)</text>
  <text x="780" y="202" font-size="12" class="muted">Badge: count of sessions in waiting or blocked (hidden at 0)</text>

  <line x1="780" y1="214" x2="1220" y2="214" class="line-soft"/>

  <text x="780" y="236" font-size="12" font-weight="600" class="fg">Color -- most urgent condition wins:</text>

  <rect x="780" y="246" width="14" height="14" fill="#c2352f"/>
  <text x="802" y="257" font-size="12" class="muted">urgent -- any session is blocked</text>

  <rect x="780" y="270" width="14" height="14" fill="#e6e6e6"/>
  <text x="802" y="281" font-size="12" class="muted">foreground -- none blocked, any waiting</text>

  <rect x="780" y="294" width="14" height="14" fill="#5a5a5a"/>
  <text x="802" y="305" font-size="12" class="muted">muted -- all working, starting, or idle</text>

  <rect x="780" y="318" width="14" height="14" fill="none" stroke="#4a4a4a" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="802" y="329" font-size="12" class="muted">hidden -- no live sessions (unless showWhenEmpty)</text>

  <line x1="780" y1="344" x2="1220" y2="344" class="line-soft"/>
  <text x="780" y="366" font-size="11" class="dim">Shown here: 1 blocked + 1 waiting = badge 2, color urgent.</text>

  <!-- ============ WIREFRAME KEY (meta legend, all screens) ============ -->
  <rect x="24" y="706" width="300" height="72" rx="4" fill="#161616" stroke="#4a4a4a" stroke-width="1"/>
  <text x="34" y="722" font-size="10" font-weight="700" letter-spacing="1" class="dim">WIREFRAME KEY</text>
  <line x1="34" y1="732" x2="54" y2="732" class="line"/>
  <text x="60" y="736" font-size="9" class="dim">solid = real UI element</text>
  <line x1="34" y1="748" x2="54" y2="748" class="line dash"/>
  <text x="60" y="752" font-size="9" class="dim">dashed = annotation / callout</text>
  <rect x="34" y="760" width="12" height="8" fill="#c2352f"/>
  <text x="60" y="768" font-size="9" class="dim">red = urgent color</text>

  <!-- ============ FOOTER ============ -->
  <text x="24" y="792" font-size="10" class="dim">proposed, 2026-09-01, drawn against the spec, not the rig</text>
  <text x="1256" y="792" text-anchor="end" font-size="10" class="dim">sessions-panel / widget-at-rest / v4.0.2</text>
</svg>
